services:
  mariadb:
    image: docker.io/mariadb:lts
    container_name: bd-dwes
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_REPLICATION_USER: ${MARIADB_REPLICATION_USER}
      MARIADB_REPLICATION_PASSWORD: ${MARIADB_REPLICATION_PASSWORD}
      MARIADB_DATABASE: ejemplo
    ports:
      - "3306:3306"
    volumes:
      - datos-dwes:/var/lib/mysql

volumes:
  datos-dwes: