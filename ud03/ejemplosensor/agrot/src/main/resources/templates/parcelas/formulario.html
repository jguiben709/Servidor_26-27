<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Panel')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>

    <main class="app-main flex-grow-1 p-3 p-lg-4">

        <div th:replace="~{fragments/layout :: header-main('Nueva parcela')}"></div>

        <div class="row g-3">
            <form style="max-width: 400px;" class="p-3 border rounded"
                  th:action="@{/parcels}" th:object="${parcela}" th:method="post"
            >
                <div class="estado-alarma" th:if="${#fields.hasErrors()}">
                    <p th:each="e : ${#fields.errors()}" th:text="${e}">Error general</p>
                </div>

                <div class="mb-3 mt-6">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                </div>
                <div class="mb-3">
                    <label for="ubicacion" class="form-label">Ubicación</label>
                    <input type="text" class="form-control" id="ubicacion" th:field="*{ubicacion}" required>
                </div>
                <div class="mb-3">
                    <label for="superficie" class="form-label">Superficie</label>
                    <input type="text" class="form-control" id="superficie" th:field="*{superficie}" required>
                </div>
                <div class="mb-3">
                    <label for="tipo" class="form-label">Tipo</label>
                    <select class="form-control" id="tipo" th:field="*{tipo}">
                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>

                <input type="hidden" th:field="*{id}" />
                <button type="submit" class="btn-primary">Guardar</button>
            </form>
        </div>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
