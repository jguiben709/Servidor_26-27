<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Sensor</title>
</head>
<body>

    <div class="container">

        <div class="card mt-3" style="max-width: 320px;">
            <div class="card-body">
                <h4  th:text="${sensor.getName()}" class="card-title"></h4>
                <p th:text="${sensor.getModel()}" class="card-subtitle fg-3"></p>
                <p class="card-text">
                    (<span th:text="${sensor.getLatitud()}"></span>,
                    <span th:text="${sensor.getLongitud()}"></span>)
                </p>
                <a th:href="@{/sensors}" class="btn-outline theme-primary">Volver atrás</a>
            </div>
        </div>

    </div>


    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
