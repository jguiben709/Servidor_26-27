<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Panel')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>

    <main class="app-main flex-grow-1 p-3 p-lg-4">
        <div th:replace="~{fragments/layout :: header-main('Lecturas')}"></div>

        <div class="row g-3">

            <div class="container mt-3">

                <div class="card mb-3">
                    <div class="card-body">
                        <form th:action="@{/sensors/lecturas}" method="get" class="row g-3 align-items-end">
                            <div class="col-sm-6 col-lg-4">
                                <label for="start" class="form-label">Fecha inicio</label>
                                <input type="datetime-local" class="form-control" id="start" name="start" th:value="${#dates.format(start, 'yyyy-MM-ddTHH:mm')}" required />
                            </div>
                            <div class="col-sm-6 col-lg-4">
                                <label for="end" class="form-label">Fecha fin</label>
                                <input type="datetime-local" class="form-control" id="end" name="end" th:value="${#dates.format(end, 'yyyy-MM-ddTHH:mm')}" required />
                            </div>
                            <div class="col-sm-4 col-lg-3">
                                <label for="tipo" class="form-label">Sensor</label>
                                <select class="form-control" id="tipo" name="tipo">
                                    <option value="TODOS">Todos</option>
                                    <option th:each="t : ${sensors}" th:value="${t.getId()}" th:text="${t.getName()}"
                                            th:selected="${t.toString() == tipo}"></option>
                                </select>
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-search me-1"></i>Buscar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="resultados-container">
                    <table id="resultados" class="table table-striped">
                        <thead>
                        <tr>
                            <th>FECHA</th>
                            <th>VALOR</th>
                        </tr>
                        </thead>
                        <tbody>
                        <div th:if ="${lecturas != null}">
                            <tr th:each="lectura : ${lecturas.content}">
                                <td th:text="${lectura.getFechaHora()}"></td>
                                <td th:text="${lectura.getValor()}"></td>
                            </tr>
                        </div>
                        <tr th:unless="${lecturas != null}">
                            <td colspan="7">No hay lecturas.</td>
                        </tr>
                        </tbody>
                    </table>

                    <!-- Paginación -->
                    <div th:if="${lecturas != null}">
                        <nav th:if="${lecturas.totalPages > 1}" class="mt-2">
                            <ul class="pagination">

                                <li class="page-item" th:classappend="${lecturas.first} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/sensors/lecturas(id=${sensor.getId()},page=${lecturas.number - 1}, size=${lecturas.size}, start=${start}, end=${end})}">
                                        Anterior
                                    </a>
                                </li>

                                <li class="page-item"
                                    th:each="i : ${#numbers.sequence(0, lecturas.totalPages - 1)}"
                                    th:classappend="${i == lecturas.number} ? 'active'">
                                    <a class="page-link"
                                       th:href="@{/sensors/lecturas(id=${sensor.getId()},page=${i}, size=${lecturas.size}, start=${start}, end=${end})}"
                                       th:text="${i + 1}">1</a>
                                </li>

                                <li class="page-item" th:classappend="${lecturas.last} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/sensors/lecturas(id=${sensor.getId()},page=${lecturas.number + 1}, size=${lecturas.size}, start=${start}, end=${end})}">
                                        Siguiente
                                    </a>
                                </li>

                            </ul>
                        </nav>
                    </div>
                </div>

            </div>
        </div>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>


<th:block th:replace="~{fragments/layout :: scripts}"></th:block>


</body>
</html>
